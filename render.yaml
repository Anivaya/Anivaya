services:
  - type: web
    name: anivaya-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm --prefix back ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: anivaya
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: anivaya-private
      - key: APP_URL
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: API_PROXY_SECRET
        sync: false
      - key: MAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: LEGAL_CONTENT_JSON
        sync: false
      - key: REMINDERS_MODE
        value: external
      - key: CRON_SECRET
        sync: false
